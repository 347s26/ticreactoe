# Used at the http level (conf.d files are included inside nginx's http block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend paths to Daphne
    # Includes WebSocket (/ws/), REST API (/api/), auth (/_allauth/, /accounts/),
    # admin (/admin/), and Django-served static files (/static/)
    location ~ ^/(api|_allauth|admin|accounts|static|ws)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for WebSocket upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket connections open
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # SPA fallback: all other paths serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
